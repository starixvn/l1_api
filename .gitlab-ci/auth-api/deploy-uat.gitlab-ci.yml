build_image_auth_api_uat:
  extends:
    - .deploy_vars_auth_api
    - .build_image
    - .deploy-auth:uat:rules
  environment:
    name: UAT

post_build_auth_api_uat:
  extends:
    - .deploy_vars_auth_api
    - .post_build
    - .deploy-auth:uat:rules
  needs: ['build_image_auth_api_uat']
  environment:
    name: UAT

deploy_auth_api_uat:
  extends:
    - .deploy_vars_auth_api
    - .base_deploy_kbt
    - .deploy-auth:uat:rules
  needs: ['post_build_auth_api_uat']
  variables:
    SERVER_IP: $SIT_IP
    SERVER_USER: $SIT_USER
    SERVER_PORT: $SIT_SSH_PORT
    DOCKER_PUBLIC_PORT: 7513
    DOCKER_PRIVATE_PORT: 7513
  environment:
    name: UAT
