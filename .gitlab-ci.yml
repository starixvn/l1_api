deploy_game_lobby_simulator:
  stage: deploy-game-lobby-simulator
  before_script:
    - eval $(ssh-agent -s)
    - echo "$SSH_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  script:
    - tar jcf - ./L1.Client.NodeJS | ssh root@$HOST 'tar -C /var/www/l1/game-lobby-simulator/ -jxf -'
    - tar -C ./L1.GameLobbySimulator/ -jcf - ./ | ssh root@$HOST 'tar -C /var/www/l1/game-lobby-simulator/simulator/ -jxf -'
    - ssh root@$HOST 'npm run build  --prefix /var/www/l1/game-lobby-simulator/simulator/ | sudo service l1-gamelobby-simulator restart'
  environment:
    name: deploying
  tags:
    - deploy-nodejs
