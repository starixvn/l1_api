variables:
  WEB_API_ROOT_PATH: ./L1.WebApi
  WEB_API_BUILD_PATH: ./build/web-api
  WEB_API_PROJECT_NAME: L1.WebApi.csproj

.web-api-push-git-compiled:
  script: 
    - if [ "$CI_ENVIRONMENT_NAME" == "PRO" ]; 
      then
        export GIT_BRANCH=master;
      else
        export GIT_BRANCH=$CI_ENVIRONMENT_NAME;
      fi
    - echo $GIT_BRANCH
    - echo "====== Pushing git compiled ... ======"
    - git clone --branch $GIT_BRANCH $WEB_API_GIT_COMPILED_REPO $WEB_API_BUILD_PATH
    - mkdir temp
    - mv $WEB_API_BUILD_PATH/.git ./temp
    - rm -rfv $WEB_API_BUILD_PATH/
    - cp -r ./temp/ $WEB_API_BUILD_PATH
    - dotnet publish -c $CI_ENVIRONMENT_NAME -r linux-x64 --self-contained false $WEB_API_ROOT_PATH/$WEB_API_PROJECT_NAME -o $WEB_API_BUILD_PATH
    - cp $WEB_API_ROOT_PATH/gitlab-ci-after-script-${CI_ENVIRONMENT_NAME}.sh $WEB_API_BUILD_PATH
    - cd $WEB_API_BUILD_PATH
    - git add .
    - if [ -z "$(git status --porcelain)" ]; 
      then 
        echo "Nothing change"; 
      else 
       git commit -m "$COMMIT_MESSAGE"; git push -u origin $GIT_BRANCH -f;
       echo "==============Waiting for after script execution==============";
       sleep 60; 
      fi

.base-web-api:
  stage: deploy
  tags:
    - docker
  retry:
    max: 2
    when:
      - runner_system_failure
      - forward_deployment_failure
      - archived_failure

build:web-api:
  stage: build
  script:   
    - dotnet clean $WEB_API_ROOT_PATH/$WEB_API_PROJECT_NAME
    - dotnet restore $WEB_API_ROOT_PATH/$WEB_API_PROJECT_NAME
    - dotnet build $WEB_API_ROOT_PATH/$WEB_API_PROJECT_NAME
  tags:
    - docker
  only:
    - master

local_deploy:web_api:
  extends: 
    - .base-web-api
    - .web-api-push-git-compiled
  environment:
    name: LOCAL
  only:
    - /^deploy-local-\d{8}-\d+.*$/
    - /^deploy-local-api-\d{8}-\d+.*$/
    - /^deploy-\d{8}-\d+.*$/
    - /^deploy-api-\d{8}-\d+.*$/

sit_deploy:web_api:
  extends: 
    - .base-web-api
    - .web-api-push-git-compiled
  environment:
    name: SIT
  only:
    - /^deploy-sit-\d{8}-\d+.*$/
    - /^deploy-sit-api-\d{8}-\d+.*$/
    - /^deploy-\d{8}-\d+.*$/
    - /^deploy-api-\d{8}-\d+.*$/

uat_deploy:web_api:
  extends: 
    - .base-web-api
    - .web-api-push-git-compiled
  environment:
    name: UAT
  only:
    - /^deploy-uat-\d{8}-\d+.*$/
    - /^deploy-uat-api-\d{8}-\d+.*$/
    - /^deploy-\d{8}-\d+.*$/
    - /^deploy-api-\d{8}-\d+.*$/

prod_deploy:web_api:
  resource_group: web_api
  extends: 
    - .base-web-api
    - .web-api-push-git-compiled
  environment:
    name: PRO
    url: http://api.saba.vin/
  needs:
    - build:web-api
  when: manual
  allow_failure: false
  only:
    - master

