variables:
    WEB_API_BUILD_PATH: ./build/api
    WEB_API_ROOT_PATH: ./L1.WebApi
    AUTH_API_ROOT_PATH: ./L1.IdentityServerApi
    AUTH_API_BUILD_AUTH: ./build/auth-api

before_script:
  - echo "====== Setting SSH Key ======"
  - eval $(ssh-agent -s)
  - echo "$SSH_KEY" | ssh-add -
  - mkdir -p ~/.ssh
  - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config

stages:
  - build
  - deploy-web-api
  - deploy-auth-api
    
local_deploy_web_api:
  stage: deploy-web-api
  script:
    - dotnet clean $WEB_API_ROOT_PATH/L1.WebApi.csproj
    - dotnet restore $WEB_API_ROOT_PATH/L1.WebApi.csproj
    - dotnet build $WEB_API_ROOT_PATH/L1.WebApi.csproj
    - echo "====== Deploying ... ======"
    - dotnet publish -c LOCAL -r linux-x64 --self-contained false $WEB_API_ROOT_PATH/L1.WebApi.csproj -o $WEB_API_BUILD_PATH
    - tar -C $WEB_API_BUILD_PATH -jcf - ./ | ssh root@$HOST 'tar -C /var/www/l1/api/ -jxf -'
    - ssh root@$HOST 'sudo service l1-api restart'
  tags:
    - deploy-dotnet
  environment:
    name: LOCAL
  only:
    - /^deploy-local-\d{8}-\d+.*$/
    - /^deploy-local-api-\d{8}-\d+.*$/
    - /^deploy-api-\d{8}-\d+.*$/

local_deploy_auth_api:
  stage: deploy-auth-api
  script:   
    - dotnet clean $AUTH_API_ROOT_PATH/L1.IdentityServerApi.csproj
    - dotnet restore $AUTH_API_ROOT_PATH//L1.IdentityServerApi.csproj
    - dotnet build $AUTH_API_ROOT_PATH//L1.IdentityServerApi.csproj
    - echo "====== Deploying ... ======"
    - dotnet publish -c LOCAL -r linux-x64 --self-contained false $AUTH_API_ROOT_PATH/L1.IdentityServerApi.csproj -o $AUTH_API_BUILD_AUTH
    - tar -C $AUTH_API_BUILD_AUTH -jcf - ./ | ssh root@$HOST 'tar -C /var/www/l1/identity-api/ -jxf -'
    - ssh root@$HOST 'sudo service l1-identity-api restart'
  tags:
    - deploy-dotnet
  environment:
    name: LOCAL
  only:
    - /^deploy-local-\d{8}-\d+.*$/
    - /^deploy-local-auth-api-\d{8}-\d+.*$/
    - /^deploy-auth-api-\d{8}-\d+.*$/

sit_deploy_web_api:
  stage: deploy-web-api
  script:   
    - dotnet clean $WEB_API_ROOT_PATH/L1.WebApi.csproj
    - dotnet restore $WEB_API_ROOT_PATH/L1.WebApi.csproj
    - dotnet build $WEB_API_ROOT_PATH/L1.WebApi.csproj
    - export COMMIT_MESSAGE=$(git log -1 --pretty=%B)
    - echo "====== Pushing git compiled ... ======"
    - git clone git@gitlab.com:l1-compiled/api-compiled.git $WEB_API_BUILD_PATH
    - dotnet publish -c SIT -r linux-x64 --self-contained false $WEB_API_ROOT_PATH/L1.WebApi.csproj -o $WEB_API_BUILD_PATH
    - cp $WEB_API_ROOT_PATH/gitlab-ci-after-script-SIT.sh $WEB_API_BUILD_PATH
    - cd $WEB_API_BUILD_PATH
    - git add .
    - if [ -z "$(git status --porcelain)" ]; then echo "Nothing change"; else git commit -m "$COMMIT_MESSAGE"; fi
    - git push -u origin master
    - echo "==============Waiting for after script execution=============="
    - sleep 60
  tags:
    - deploy-dotnet
  environment:
    name: SIT
  only:
    - /^deploy-sit-\d{8}-\d+.*$/
    - /^deploy-sit-api-\d{8}-\d+.*$/
    - /^deploy-api-\d{8}-\d+.*$/
 
sit_deploy_auth_api:
  stage: deploy-auth-api
  script:   
    - dotnet clean $AUTH_API_ROOT_PATH/L1.IdentityServerApi.csproj
    - dotnet restore $AUTH_API_ROOT_PATH/L1.IdentityServerApi.csproj
    - dotnet build $AUTH_API_ROOT_PATH/L1.IdentityServerApi.csproj
    - export COMMIT_MESSAGE=$(git log -1 --pretty=%B)
    - echo "====== Pushing git compiled ... ======"
    - git clone git@gitlab.com:l1-compiled/identity-api-compiled.git ./build/auth-api/
    - dotnet publish -c SIT -r linux-x64 --self-contained false $AUTH_API_ROOT_PATH/L1.IdentityServerApi.csproj -o ./build/auth-api
    - cp $AUTH_API_ROOT_PATH//gitlab-ci-after-script-SIT.sh ./build/auth-api/
    - cd ./build/auth-api
    - git add .
    - if [ -z "$(git status --porcelain)" ]; then echo "Nothing change"; else git commit -m "$COMMIT_MESSAGE"; fi
    - git push -u origin master
    - echo "==============Waiting for after script execution=============="
    - sleep 60
  tags:
    - deploy-dotnet
  environment:
    name: SIT
  only:
    - /^deploy-sit-\d{8}-\d+.*$/
    - /^deploy-sit-auth-api-\d{8}-\d+.*$/
    - /^deploy-auth-api-\d{8}-\d+.*$/

