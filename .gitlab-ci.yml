include:
    project: "ci/core-cicd"
    ref: main
    file: luminet.gitlab-ci.yml

variables:
  NODE_VERSION: "16"

stages:
  - test

api-tests:
  stage: test
  image: node:${NODE_VERSION}
  before_script:
    - npm install -g newman newman-reporter-htmlextra
    - npm install csv-parser fs
  script:
    - node runnewmanci.js
  artifacts:
    when: always
    paths:
      - reports/
    reports:
      junit: reports/*.xml
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: false
  timeout: 30 minutes
