deploy_test_game_lobby_simulator:
  stage: deploy-game-lobby-simulator
  before_script:
    - eval $(ssh-agent -s)
    - echo "$SSH_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  script:
    - tar jcf - ./L1.Client.NodeJS | ssh root@$HOST 'tar -C /var/www/l1/game-lobby-simulator/ -jxf -'
    - tar -C ./L1.GameLobbySimulator/ -jcf - ./ | ssh root@$HOST 'tar -C /var/www/l1/game-lobby-simulator/simulator/ -jxf -'
    - ssh root@$HOST 'npm install --prefix /var/www/l1/game-lobby-simulator/simulator/ && npm run build  --prefix /var/www/l1/game-lobby-simulator/simulator/ | sudo service l1-gamelobby-simulator restart'
    - ssh root@$HOST 'chmod -R 777 /var/www/l1/game-lobby-simulator/simulator/resource /var/www/l1/game-lobby-simulator/simulator/game-client-config.json'
  tags:
    - deploy-nodejs
  only:
    - /^deploy-test-\d{8}-\d+.*$/
    - /^deploy-test-game-lobby-simulator-\d{8}-\d+.*$/
    
deploy_web_api_SIT:
  stage: deploy-sit
  before_script:
    - echo "====== Setting SSH Key ======"
    - eval $(ssh-agent -s)
    - echo "$SSH_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - dotnet clean ./L1.WebApi/L1.WebApi.csproj
    - dotnet restore ./L1.WebApi/L1.WebApi.csproj
    - dotnet build ./L1.WebApi/L1.WebApi.csproj
    - export COMMIT_MESSAGE=$(git log -1 --pretty=%B)
  script:   
    - echo "====== Pushing git compiled ... ======"
    - git clone git@gitlab.com:l1-compiled/api-compiled.git ./build/api/
    - dotnet publish -c SIT -r linux-x64 --self-contained false ./L1.WebApi/L1.WebApi.csproj -o ./build/api/
    - cd ./build/api
    - git add .
    - if [ -z "$(git status --porcelain)" ]; then echo "Nothing change"; else git commit -m "$COMMIT_MESSAGE"; fi
    - git push -u origin master

  artifacts:
    expire_in: 1 days
    paths:
      - './build/api/'
  tags:
    - deploy-dotnet
 # only:
 #   - /^deploy-test-\d{8}-\d+.*$/
 #   - /^deploy-test-api-\d{8}-\d+.*$/
