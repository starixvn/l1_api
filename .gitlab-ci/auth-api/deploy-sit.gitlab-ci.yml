build_image_auth_api_sit:
  extends:
    - .deploy_vars_auth_api
    - .build_image
    - .deploy-auth:sit:rules
  environment:
    name: SIT

post_build_auth_api_sit:
  extends:
    - .deploy_vars_auth_api
    - .post_build
    - .deploy-auth:sit:rules
  needs: ['build_image_auth_api_sit']
  environment:
    name: SIT

deploy_auth_api_sit:
  extends:
    - .deploy_vars_auth_api
    - .base_deploy_kbt
    - .deploy-auth:sit:rules
  needs: ['post_build_auth_api_sit']
  variables:
    SERVER_IP: $SIT_IP
    SERVER_USER: $SIT_USER
    SERVER_PORT: $SIT_SSH_PORT
    DOCKER_PUBLIC_PORT: 6503
    DOCKER_PRIVATE_PORT: 6503
  environment:
    name: SIT
