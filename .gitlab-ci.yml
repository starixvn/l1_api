stages:
  - build
  - deploy-local
  - deploy-auth-api
  - deploy-member-site-simulator
  - deploy-ow-api-simulator
  - deploy-game-lobby-simulator
    
deploy_web_api_LOCAL:
  stage: deploy-local
  before_script:
    - echo "====== Setting SSH Key ======"
    - eval $(ssh-agent -s)
    - echo "$SSH_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - dotnet clean ./L1.WebApi/L1.WebApi.csproj
    - dotnet restore ./L1.WebApi/L1.WebApi.csproj
    - dotnet build ./L1.WebApi/L1.WebApi.csproj
  script:   
    - echo "====== Deploying ... ======"
    - dotnet publish -c TEST -r linux-x64 --self-contained false ./L1.WebApi/L1.WebApi.csproj -o ./build/api
    - tar -C ./build/api/ -jcf - ./ | ssh root@$HOST 'tar -C /var/www/l1/api/ -jxf -'
    - ssh root@$HOST 'sudo service l1-api restart'
  artifacts:
    expire_in: 1 days
    paths:
      - './build/api'
  tags:
    - deploy-dotnet
  only:
    - /^deploy-test-\d{8}-\d+.*$/
    - /^deploy-test-api-\d{8}-\d+.*$/

