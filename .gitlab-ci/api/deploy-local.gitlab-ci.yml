build_image_api_local:
  extends:
    - .deploy_vars_api
    - .build_image
    - .deploy-api:local:rules
  environment:
    name: LOCAL

post_build_api_local:
  extends:
    - .deploy_vars_api
    - .post_build
    - .deploy-api:local:rules
  needs: ['build_image_api_local']
  environment:
    name: LOCAL

deploy_api_local:
  extends:
    - .deploy_vars_api
    - .base_deploy_swarm_service
    - .deploy-api:local:rules
  needs: ['post_build_api_local']
  variables:
    SERVER_IP: $LOCAL_IP
    SERVER_USER: $LOCAL_USER
    SERVER_PORT: $LOCAL_SSH_PORT
    SWARM_NODES: $LOCAL_SWARM_CLUSTER
    SWARM_REPLICAS: 1
    NODE_LABEL: L1
    DOCKER_PUBLIC_PORT: 8100
    DOCKER_PRIVATE_PORT: 8100
    DOCKER_NETWORK_NAME: lumi-network
  environment:
    name: LOCAL
