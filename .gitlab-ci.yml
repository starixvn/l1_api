  script:   
    - dotnet clean $AUTH_API_ROOT_PATH/L1.IdentityServerApi.csproj
    - dotnet restore $AUTH_API_ROOT_PATH/L1.IdentityServerApi.csproj
    - dotnet build $AUTH_API_ROOT_PATH/L1.IdentityServerApi.csproj
    - export COMMIT_MESSAGE=$(git log -1 --pretty=%B)
    - echo "====== Pushing git compiled ... ======"
    - git clone --branch UAT $AUTH_API_GIT_COMPILED_REPO $AUTH_API_BUILD_AUTH
    - dotnet publish -c UAT -r linux-x64 --self-contained false $AUTH_API_ROOT_PATH/L1.IdentityServerApi.csproj -o $AUTH_API_BUILD_AUTH
    - cp $AUTH_API_ROOT_PATH/gitlab-ci-after-script-UAT.sh $AUTH_API_BUILD_AUTH
    - cd $AUTH_API_BUILD_AUTH
    - git add .
    - if [ -z "$(git status --porcelain)" ]; 
      then 
        echo "Nothing change"; 
      else 
       git commit -m "$COMMIT_MESSAGE"; git push -u origin UAT;
       echo "==============Waiting for after script execution==============";
       sleep 60; 
      fi
  tags:
    - deploy-dotnet
  environment:
    name: UAT
  only:
    - /^deploy-\d{8}-\d+.*$/
    - /^deploy-uat-\d{8}-\d+.*$/
    - /^deploy-uat-auth-api-\d{8}-\d+.*$/
    - /^deploy-auth-api-\d{8}-\d+.*$/

includes:
  - .gitlab-ci-web-api.yml