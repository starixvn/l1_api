stages:
  - build
  - deploy-web-api
  - deploy-auth-api
    
deploy_web_api_LOCAL:
  stage: deploy-web-api
  before_script:
    - echo "====== Setting SSH Key ======"
    - eval $(ssh-agent -s)
    - echo "$SSH_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - dotnet clean ./L1.WebApi/L1.WebApi.csproj
    - dotnet restore ./L1.WebApi/L1.WebApi.csproj
    - dotnet build ./L1.WebApi/L1.WebApi.csproj
  script:   
    - echo "====== Deploying ... ======"
    - dotnet publish -c LOCAL -r linux-x64 --self-contained false ./L1.WebApi/L1.WebApi.csproj -o ./build/api
    - tar -C ./build/api/ -jcf - ./ | ssh root@$HOST 'tar -C /var/www/l1/api/ -jxf -'
    - ssh root@$HOST 'sudo service l1-api restart'
  artifacts:
    expire_in: 1 days
    paths:
      - './build/api'
  tags:
    - deploy-dotnet
  environment:
    name: LOCAL
  only:
    - /^deploy-local-\d{8}-\d+.*$/
    - /^deploy-local-api-\d{8}-\d+.*$/
    - /^deploy-api-\d{8}-\d+.*$/

deploy_auth_api_LOCAL:
  stage: deploy-auth-api
  before_script:
    - echo "====== Setting SSH Key ======"
    - eval $(ssh-agent -s)
    - echo "$SSH_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - dotnet clean ./L1.IdentityServerApi/L1.IdentityServerApi.csproj
    - dotnet restore ./L1.IdentityServerApi/L1.IdentityServerApi.csproj
    - dotnet build ./L1.IdentityServerApi/L1.IdentityServerApi.csproj
  script:   
    - echo "====== Deploying ... ======"
    - dotnet publish -c LOCAL -r linux-x64 --self-contained false ./L1.IdentityServerApi/L1.IdentityServerApi.csproj -o ./build/auth-api
    - tar -C ./build/auth-api/ -jcf - ./ | ssh root@$HOST 'tar -C /var/www/l1/identity-api/ -jxf -'
    - ssh root@$HOST 'sudo service l1-identity-api restart'
  artifacts:
    expire_in: 1 days
    paths:
      - './build/auth-api'
  tags:
