variables:
  GIT_COMPILED_REPO: git@gitlab.com:l1-compiled/api-compiled.git
  ROOT_PATH: ./L1.WebApi
  BUILD_PATH: ./build/web-api
  PROJECT_NAME: L1.WebApi.csproj

.base-web-api:
  stage: deploy
  tags:
    - deploy-dotnet-2
  only:
    - /^deploy-\d{8}-\d+.*$/
    - /^deploy-api-\d{8}-\d+.*$/

build:web-api:
  stage: build
  script:   
    - dotnet clean $ROOT_PATH/$PROJECT_NAME
    - dotnet restore $ROOT_PATH/$PROJECT_NAME
    - dotnet build $ROOT_PATH/$PROJECT_NAME
  tags:
    - deploy-dotnet-2

local_deploy:web_api:
  extends: 
    - .base-web-api
  script:
    - echo "====== Deploying ... ======"
    - dotnet publish -c LOCAL -r linux-x64 --self-contained false $ROOT_PATH/$PROJECT_NAME -o $BUILD_PATH
    - tar -C $BUILD_PATH -jcf - ./ | ssh root@$HOST 'tar -C /var/www/l1/api/ -jxf -'
    - ssh root@$HOST 'sudo service l1-api restart'
  environment:
    name: LOCAL
  dependencies:
    - build:web-api
  only:
    - /^deploy-local-\d{8}-\d+.*$/
    - /^deploy-local-api-\d{8}-\d+.*$/

sit_deploy:web_api:
  extends: 
    - .base-web-api
    - .push-git-compiled
  environment:
    name: SIT
  dependencies:
    - build:web-api
  only:
    - /^deploy-sit-\d{8}-\d+.*$/
    - /^deploy-sit-api-\d{8}-\d+.*$/

uat_deploy:web_api:
  extends: 
    - .base-web-api
    - .push-git-compiled
  environment:
    name: UAT
  dependencies:
    - build:web-api
  only:
    - /^deploy-uat-\d{8}-\d+.*$/
    - /^deploy-uat-api-\d{8}-\d+.*$/

prod_deploy:web_api:
  extends: 
    - .base-web-api
    - .push-git-compiled
  environment:
    name: PRO
    url: http://api.saba.vin/
  dependencies:
    - build:web-api
  when: manual
  allow_failure: false
  only:
    - master

