stages:
  - build
  - deploy

before_script:
  - echo "====== Setting SSH Key ======"
  - eval $(ssh-agent -s)
  - echo "$SSH_KEY" | ssh-add -
  - mkdir -p ~/.ssh
  - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  - export COMMIT_MESSAGE=$(git log -1 --pretty=%B)

include:
  - .gitlab-ci-push-git-compiled.yml
  - .gitlab-ci-web-api.yml
#  - .gitlab-ci-identity-api.yml