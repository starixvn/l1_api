variables:
  GIT_COMPILED_REPO: git@gitlab.com:l1-compiled/identity-api-compiled.git
  ROOT_PATH: ./L1.IdentityServerApi
  BUILD_PATH: ./build/auth-api
  PROJECT_NAME: L1.IdentityServerApi.csproj

.push-git-compiled:
  script: 
    - if [ "$CI_ENVIRONMENT_NAME" == "PRO" ]; 
      then
        export GIT_BRANCH=master;
      else
        export GIT_BRANCH=$CI_ENVIRONMENT_NAME;
      fi
    - echo $GIT_BRANCH
    - echo "====== Pushing git compiled ... ======"
    - git clone --branch $GIT_BRANCH $GIT_COMPILED_REPO $BUILD_PATH
    - dotnet publish -c $CI_ENVIRONMENT_NAME -r linux-x64 --self-contained false $ROOT_PATH/$PROJECT_NAME -o $BUILD_PATH
    - cp $ROOT_PATH/gitlab-ci-after-script-${CI_ENVIRONMENT_NAME}.sh $BUILD_PATH
    - cd $BUILD_PATH
    - git add .
    - if [ -z "$(git status --porcelain)" ]; 
      then 
        echo "Nothing change"; 
      else 
       git commit -m "$COMMIT_MESSAGE"; git push -u origin $GIT_BRANCH;
       echo "==============Waiting for after script execution==============";
       sleep 60; 
      fi

.base-identity-api:
  stage: deploy
  tags:
    - deploy-dotnet-2
  retry:
    max: 2
    when:
      - runner_system_failure
      - forward_deployment_failure
      - archived_failure

build:identity-api:
  stage: build
  script:   
    - dotnet clean $ROOT_PATH/$PROJECT_NAME
    - dotnet restore $ROOT_PATH/$PROJECT_NAME
    - dotnet build $ROOT_PATH/$PROJECT_NAME
  tags:
    - docker
  only:
    - master
    - /^deploy-\d{8}-\d+.*$/
    - /^deploy-auth-api-\d{8}-\d+.*$/
    - /^deploy-local-\d{8}-\d+.*$/
    - /^deploy-local-auth-api-\d{8}-\d+.*$/
    - /^deploy-sit-\d{8}-\d+.*$/
    - /^deploy-sit-auth-api-\d{8}-\d+.*$/
    - /^deploy-uat-\d{8}-\d+.*$/
    - /^deploy-uat-auth-api-\d{8}-\d+.*$/

local_deploy:auth_api:
  extends: .base-identity-api
  script:
    - apt-get update
    - apt-get --assume-yes install build-essential
    - echo "====== Deploying ... ======"
    - dotnet publish -c LOCAL -r linux-x64 --self-contained false $ROOT_PATH/$PROJECT_NAME -o $BUILD_PATH
    - tar -C $BUILD_PATH -jcf - ./ | ssh root@$HOST 'tar -C /var/www/l1/identity-api/ -jxf -'
    - ssh root@$HOST 'sudo service l1-identity-api restart'
  environment:
    name: LOCAL
  needs:
    - build:identity-api
  only:
    - /^deploy-local-\d{8}-\d+.*$/
    - /^deploy-local-auth-api-\d{8}-\d+.*$/
    - /^deploy-\d{8}-\d+.*$/
    - /^deploy-auth-api-\d{8}-\d+.*$/
 
sit_deploy_auth_api:
  extends: 
    - .base-identity-api
    - .push-git-compiled
  environment:
    name: SIT
  needs:
    - build:identity-api
  only:
    - /^deploy-sit-\d{8}-\d+.*$/
    - /^deploy-sit-auth-api-\d{8}-\d+.*$/
    - /^deploy-\d{8}-\d+.*$/
    - /^deploy-auth-api-\d{8}-\d+.*$/

uat_deploy:auth_api:
  extends: 
    - .base-identity-api
    - .push-git-compiled
  environment:
    name: UAT
  needs:
    - build:identity-api
  only:
    - /^deploy-uat-\d{8}-\d+.*$/
    - /^deploy-uat-auth-api-\d{8}-\d+.*$/
    - /^deploy-\d{8}-\d+.*$/
    - /^deploy-auth-api-\d{8}-\d+.*$/

prod_deploy:auth_api:
  resource_group: auth_api
  extends:
    - .base-identity-api
    - .push-git-compiled
  retry:
    max: 2
  needs:
    - build:identity-api
  environment:
    name: PRO
    url: http://auth.saba.vin/
  allow_failure: false
  when: manual
  only:
    - master
    - /^deploy-\d{8}-\d+.*$/
    - /^deploy-auth-api-\d{8}-\d+.*$/