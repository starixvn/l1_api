variables:
  ROOT_PATH: ./L1.IdentityServerApi
  BUILD_PATH: ./build/auth-api
  PROJECT_NAME: L1.IdentityServerApi.csproj

.push-git-compiled:
  script: 
    - if [ "$CI_ENVIRONMENT_NAME" == "PRO" ]; 
      then
        export GIT_BRANCH=master;
      else
        export GIT_BRANCH=$CI_ENVIRONMENT_NAME;
      fi
    - echo $GIT_BRANCH
    - echo "====== Pushing git compiled ... ======"
    - git clone --branch $GIT_BRANCH $AUTH_API_GIT_COMPILED_REPO $BUILD_PATH
    - mkdir temp
    - mv $BUILD_PATH/.git ./temp
    - rm -rfv $BUILD_PATH/
    - cp -r ./temp/ $BUILD_PATH
    - dotnet publish -c $CI_ENVIRONMENT_NAME -r linux-x64 --self-contained false $ROOT_PATH/$PROJECT_NAME -o $BUILD_PATH
    - cp $ROOT_PATH/gitlab-ci-after-script-${CI_ENVIRONMENT_NAME}.sh $BUILD_PATH
    - cd $BUILD_PATH
    - git add .
    - if [ -z "$(git status --porcelain)" ]; 
      then 
        echo "Nothing change"; 
      else 
       git commit -m "$COMMIT_MESSAGE"; git push -u origin $GIT_BRANCH;
       echo "==============Waiting for after script execution==============";
       sleep 60; 
      fi

.base-identity-api:
  stage: deploy
  tags:
    - docker
  retry:
    max: 2
    when:
      - runner_system_failure
      - forward_deployment_failure
      - archived_failure

build:identity-api:
  stage: build
  script:   
    - dotnet clean $ROOT_PATH/$PROJECT_NAME
    - dotnet restore $ROOT_PATH/$PROJECT_NAME
    - dotnet build $ROOT_PATH/$PROJECT_NAME
  tags:
    - docker
  only:
    - master

local_deploy:auth_api:
  extends: 
    - .base-identity-api
    - .push-git-compiled
  environment:
    name: LOCAL
  rules:
    - if: $CI_COMMIT_TAG =~ /^l1-deploy-local-\d{8}-\d+.*$/
      when: always
    - if: $CI_COMMIT_TAG =~ /^l1-deploy-\d{8}-\d+.*$/
      when: always
    - if: $CI_COMMIT_TAG =~ /^l1-deploy-local-auth-api-\d{8}-\d+.*$/
      when: always
    - if: $CI_COMMIT_TAG =~ /^l1-deploy-auth-api-\d{8}-\d+.*$/
      when: always
    - when: never
 
sit_deploy_auth_api:
  extends: 
    - .base-identity-api
    - .push-git-compiled
  environment:
    name: SIT
  rules:
    - if: $CI_COMMIT_TAG =~ /^l1-deploy-sit-\d{8}-\d+.*$/
      when: always
    - if: $CI_COMMIT_TAG =~ /^l1-deploy-\d{8}-\d+.*$/
      when: always
    - if: $CI_COMMIT_TAG =~ /^l1-deploy-sit-auth-api-\d{8}-\d+.*$/
      when: always
    - if: $CI_COMMIT_TAG =~ /^l1-deploy-auth-api-\d{8}-\d+.*$/
      when: always
    - when: never

uat_deploy:auth_api:
  extends: 
    - .base-identity-api
    - .push-git-compiled
  environment:
    name: UAT
  rules:
    - if: $CI_COMMIT_TAG =~ /^l1-deploy-uat-\d{8}-\d+.*$/
      when: always
    - if: $CI_COMMIT_TAG =~ /^l1-deploy-\d{8}-\d+.*$/
      when: always
    - if: $CI_COMMIT_TAG =~ /^l1-deploy-uat-auth-api-\d{8}-\d+.*$/
      when: always
    - if: $CI_COMMIT_TAG =~ /^l1-deploy-auth-api-\d{8}-\d+.*$/
      when: always
    - when: never

prod_deploy:auth_api:
  resource_group: auth_api
  extends:
    - .base-identity-api
    - .push-git-compiled
  retry:
    max: 2
  needs:
    - build:identity-api
  environment:
    name: PRO
    url: http://auth.saba.vin/
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: manual