variables:
    AUTH_API_GIT_COMPILED_REPO: git@gitlab.com:l1-compiled/identity-api-compiled.git
    AUTH_API_ROOT_PATH: ./L1.IdentityServerApi
    AUTH_API_BUILD_AUTH: ./build/auth-api

before_script:
  - echo "====== Setting SSH Key ======"
  - eval $(ssh-agent -s)
  - echo "$SSH_KEY" | ssh-add -
  - mkdir -p ~/.ssh
  - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config

stages:
  - build
  - deploy-web-api
  - deploy-auth-api

local_deploy_auth_api:
  stage: deploy-auth-api
  script:   
    - dotnet clean $AUTH_API_ROOT_PATH/L1.IdentityServerApi.csproj
    - dotnet restore $AUTH_API_ROOT_PATH//L1.IdentityServerApi.csproj
    - dotnet build $AUTH_API_ROOT_PATH//L1.IdentityServerApi.csproj
    - echo "====== Deploying ... ======"
    - dotnet publish -c LOCAL -r linux-x64 --self-contained false $AUTH_API_ROOT_PATH/L1.IdentityServerApi.csproj -o $AUTH_API_BUILD_AUTH
    - tar -C $AUTH_API_BUILD_AUTH -jcf - ./ | ssh root@$HOST 'tar -C /var/www/l1/identity-api/ -jxf -'
    - ssh root@$HOST 'sudo service l1-identity-api restart'
  tags:
    - deploy-dotnet
  environment:
    name: LOCAL
  only:
    - /^deploy-\d{8}-\d+.*$/
    - /^deploy-local-\d{8}-\d+.*$/
    - /^deploy-local-auth-api-\d{8}-\d+.*$/
    - /^deploy-auth-api-\d{8}-\d+.*$/
 
sit_deploy_auth_api:
  stage: deploy-auth-api
  script:   
    - dotnet clean $AUTH_API_ROOT_PATH/L1.IdentityServerApi.csproj
    - dotnet restore $AUTH_API_ROOT_PATH/L1.IdentityServerApi.csproj
    - dotnet build $AUTH_API_ROOT_PATH/L1.IdentityServerApi.csproj
    - export COMMIT_MESSAGE=$(git log -1 --pretty=%B)
    - echo "====== Pushing git compiled ... ======"
    - git clone --branch SIT $AUTH_API_GIT_COMPILED_REPO $AUTH_API_BUILD_AUTH
    - dotnet publish -c SIT -r linux-x64 --self-contained false $AUTH_API_ROOT_PATH/L1.IdentityServerApi.csproj -o $AUTH_API_BUILD_AUTH
    - cp $AUTH_API_ROOT_PATH//gitlab-ci-after-script-SIT.sh $AUTH_API_BUILD_AUTH
    - cd $AUTH_API_BUILD_AUTH
    - git add .
    - if [ -z "$(git status --porcelain)" ]; 
      then 
        echo "Nothing change"; 
      else 
       git commit -m "$COMMIT_MESSAGE"; git push -u origin SIT;
       echo "==============Waiting for after script execution==============";
       sleep 60; 
      fi
  tags:
    - deploy-dotnet
  environment:
    name: SIT
  only:
    - /^deploy-\d{8}-\d+.*$/
    - /^deploy-sit-\d{8}-\d+.*$/
    - /^deploy-sit-auth-api-\d{8}-\d+.*$/
    - /^deploy-auth-api-\d{8}-\d+.*$/

