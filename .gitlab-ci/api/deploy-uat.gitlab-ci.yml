build_image_api_uat:
  extends:
    - .deploy_vars_api
    - .build_image
    - .deploy-api:uat:rules
  environment:
    name: UAT

post_build_api_uat:
  extends:
    - .deploy_vars_api
    - .post_build
    - .deploy-api:uat:rules
  needs: ['build_image_api_uat']
  environment:
    name: UAT

deploy_api_uat:
  extends:
    - .deploy_vars_api
    - .base_deploy_swarm_service
    - .deploy-api:uat:rules
  needs: ['post_build_api_uat']
  variables:
    SERVER_IP: $SC_SWARM_LEADER_SIT
    SERVER_USER: $SC_SWARM_LEADER_SIT_SSH_USER
    SERVER_PORT: $SC_SWARM_LEADER_SIT_SSH_PORT
    SWARM_NODES: $SC_SWARM_CLUSTER_SIT
    SWARM_REPLICAS: 2
    NODE_LABEL: L2
    DOCKER_PUBLIC_PORT: 7310
    DOCKER_PRIVATE_PORT: 7310
    DOCKER_NETWORK_NAME: lumi-network
  environment:
    name: UAT
