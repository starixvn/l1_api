  environment:
    name: LOCAL
  only:
    - /^deploy-local-\d{8}-\d+.*$/
    - /^deploy-local-auth-api-\d{8}-\d+.*$/
    - /^deploy-auth-api-\d{8}-\d+.*$/

deploy_web_api_SIT:
  stage: deploy-web-api
  before_script:
    - echo "====== Setting SSH Key ======"
    - eval $(ssh-agent -s)
    - echo "$SSH_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - dotnet clean ./L1.WebApi/L1.WebApi.csproj
    - dotnet restore ./L1.WebApi/L1.WebApi.csproj
    - dotnet build ./L1.WebApi/L1.WebApi.csproj
    - export COMMIT_MESSAGE=$(git log -1 --pretty=%B)
  script:   
    - echo "====== Pushing git compiled ... ======"
    - git clone git@gitlab.com:l1-compiled/api-compiled.git ./build/api/
    - dotnet publish -c SIT -r linux-x64 --self-contained false ./L1.WebApi/L1.WebApi.csproj -o ./build/api/
    - cp ./L1.WebApi/gitlab-ci-after-script-SIT.sh ./build/api/
    - cd ./build/api
    - git add .
    - if [ -z "$(git status --porcelain)" ]; then echo "Nothing change"; else git commit -m "$COMMIT_MESSAGE"; fi
    - git push -u origin master
    - echo "==============Waiting for after script execution=============="
    - sleep 60
  artifacts:
    expire_in: 1 days
    paths:
      - './build/api/'
  tags:
    - deploy-dotnet
  environment:
    name: SIT
  only:
    - /^deploy-sit-\d{8}-\d+.*$/
    - /^deploy-sit-api-\d{8}-\d+.*$/
    - /^deploy-api-\d{8}-\d+.*$/
 
deploy_auth_api_SIT:
  stage: deploy-auth-api
  before_script:
    - echo "====== Setting SSH Key ======"
    - eval $(ssh-agent -s)
    - echo "$SSH_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - dotnet clean ./L1.IdentityServerApi/L1.IdentityServerApi.csproj
    - dotnet restore ./L1.IdentityServerApi/L1.IdentityServerApi.csproj
    - dotnet build ./L1.IdentityServerApi/L1.IdentityServerApi.csproj
    - export COMMIT_MESSAGE=$(git log -1 --pretty=%B)
  script:   
    - echo "====== Pushing git compiled ... ======"
    - git clone git@gitlab.com:l1-compiled/identity-api-compiled.git ./build/auth-api/
    - dotnet publish -c SIT -r linux-x64 --self-contained false ./L1.IdentityServerApi/L1.IdentityServerApi.csproj -o ./build/auth-api
    - cp ./L1.IdentityServerApi/gitlab-ci-after-script-SIT.sh ./build/auth-api/
    - cd ./build/auth-api
    - git add .
    - if [ -z "$(git status --porcelain)" ]; then echo "Nothing change"; else git commit -m "$COMMIT_MESSAGE"; fi
    - git push -u origin master
    - echo "==============Waiting for after script execution=============="
    - sleep 60
  artifacts:
    expire_in: 1 days
    paths:
      - './build/auth-api'
  tags:
    - deploy-dotnet
  environment:
    name: SIT
  only:
    - /^deploy-sit-\d{8}-\d+.*$/
    - /^deploy-sit-auth-api-\d{8}-\d+.*$/
    - /^deploy-auth-api-\d{8}-\d+.*$/
